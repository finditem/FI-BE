spring:
  application:
    name: fmi
  profiles:
    active: local-mysql
  jpa:
    open-in-view: false
    hibernate:
        ddl-auto: update
    properties:
      hibernate:
        globally_quoted_identifiers: true
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.hibernate.SQL: info
    org.springframework.web: info

jwt:
  secret: ${JWT_SECRET:change-me-please-change-me-please-change-me-please}
  issuer: fmi
  access-token-validity-ms: 900000 # 15분
  refresh-token-validity-ms: 1209600000 # 14일
  cookie:
    name: refresh_token
    secure: false         # 로컬 개발은 false, 배포는 true 권장
    same-site: Lax        # 동일 도메인이면 Lax/Strict, 크로스 도메인이면 None


