<!DOCTYPE html>
<html>
<head>
    <title>WebSocket STOMP Test Client</title>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; }
        fieldset { border: 1px solid #ccc; padding: 10px; }
        legend { font-weight: bold; }
        textarea { width: 95%; height: 400px; font-size: 12px; margin-top: 10px; }
        input { width: 90%; margin-bottom: 5px; }
        button { margin-top: 5px; }
        #log { background-color: #f4f4f4; }
    </style>
    <meta charset="UTF-8"> <title>WebSocket STOMP 테스트 클라이언트</title>
</head>
<body>

<fieldset>
    <legend>1. 연결 및 구독 (User)</legend>
    <label for="token">Auth Token (JWT - "Bearer " 제외):</label>
    <input type="text" id="token" placeholder="여기에 JWT 토큰을 붙여넣으세요">
    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn" disabled>Disconnect</button>
    <hr>
    <p><b>구독된 개인 큐:</b></p>
    <ul style="font-size: 14px;">
        <li>/user/queue/notification (🔔 <b>알림: 새 채팅 / 리마인더</b>)</li>
        <li>/user/queue/messages (메인 채팅)</li>
        <li>/user/queue/list-updates (목록 갱신용)</li>
        <li>/user/queue/read-receipts (읽음 확인용)</li>
    </ul>
</fieldset>

<fieldset>
    <legend>2. 실시간 이벤트 로그 (Server ➡️ Client)</legend>
    <textarea id="log" readonly></textarea>
</fieldset>

<fieldset>
    <legend>3. 방 상태 관리 (Client ➡️ Server)</legend>
    <label for="roomId">Room ID:</label>
    <input type="text" id="roomId" placeholder="예: 123">
    <button id="enterBtn" disabled>방 입장 (Enter)</button>
    <button id="leaveBtn" disabled>방 퇴장 (Leave)</button>
    <button id="pingBtn" disabled>생존 신호 (Ping/TouchTTL)</button>
</fieldset>

<fieldset>
    <legend>4. 메시지 전송 (Client ➡️ Server)</legend>
    <label for="messageRoomId">Room ID:</label>
    <input type="text" id="messageRoomId" placeholder="보낼 방 ID (예: 123)">
    <label for="messageContent">Content:</label>
    <input type="text" id="messageContent" placeholder="보낼 메시지 (예: '안녕')">

    <button id="sendBtn" disabled>메시지 전송 (Send)</button>
</fieldset>

<script>
    let stompClient = null;

    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const enterBtn = document.getElementById('enterBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const pingBtn = document.getElementById('pingBtn');
    const sendBtn = document.getElementById('sendBtn');
    const logArea = document.getElementById('log');

    connectBtn.onclick = connect;
    disconnectBtn.onclick = disconnect;
    enterBtn.onclick = enterRoom;
    leaveBtn.onclick = leaveRoom;
    pingBtn.onclick = pingRoom;
    sendBtn.onclick = sendMessage;

    function log(message) {
        logArea.value += `[${new Date().toLocaleTimeString()}] ${message}\n\n`;
        logArea.scrollTop = logArea.scrollHeight;
    }

    function connect() {
        const token = document.getElementById('token').value;
        if (!token) {
            alert('Auth Token을 입력하세요!');
            return;
        }

        stompClient = new StompJs.Client({
            brokerURL: 'ws://localhost:8080/ws',
            connectHeaders: {
                Authorization: `Bearer ${token}`
            },
            heartbeatIncoming: 20000,
            heartbeatOutgoing: 20000,
            reconnectDelay: 5000,

            onConnect: (frame) => {
                log('✅ CONNECTED: ' + frame.headers['user-name']);
                setConnected(true);

                //  알림 구독 로직 (/user/queue/notification)
                stompClient.subscribe('/user/queue/notification', (message) => {
                    const body = JSON.parse(message.body);
                    let prefix = '🔔 [알림]';

                    // 리마인더와 일반 채팅 구분해서 로그 찍기
                    if (body.type === 'CHAT_REMINDER') {
                        prefix = '⏰ [리마인더]';
                    } else if (body.type === 'CHAT') {
                        prefix = '💬 [새 채팅]';
                    }

                    log(`${prefix} ${body.title}\n내용: ${body.message}\n(RefId: ${body.referenceId})`);
                });
                // -------------------------------------------------------

                stompClient.subscribe('/user/queue/messages', (message) => {
                    log('📬 /user/queue/messages (메인 메시지 수신):\n' + message.body);
                });

                stompClient.subscribe('/user/queue/list-updates', (message) => {
                    log('🔄 /user/queue/list-updates (목록 갱신):\n' + message.body);
                });

                stompClient.subscribe('/user/queue/read-receipts', (message) => {
                    log('👀 /user/queue/read-receipts (읽음 확인 수신):\n' + message.body);
                });
            },

            onDisconnect: () => {
                log('🔌 DISCONNECTED');
                setConnected(false);
            },
            onStompError: (frame) => {
                log('❌ STOMP ERROR: ' + frame.headers['message']);
            },
            onWebSocketError: (error) => {
                log('❌ WS CONNECTION ERROR: ' + error);
            }
        });

        stompClient.activate(); // 연결 시작
    }


    function disconnect() {
        if (stompClient !== null) {
            stompClient.deactivate(); // ⭐️ v7 방식 연결 해제
        }
    }

    function enterRoom() {
        const roomId = document.getElementById('roomId').value;
        if (!roomId) { alert('Room ID를 입력하세요'); return; }

        const destination = `/app/rooms/${roomId}/enter`;
        stompClient.publish({ destination: destination });
        log(`➡️ [SEND] ${destination}`);
    }

    function leaveRoom() {
        const roomId = document.getElementById('roomId').value;
        if (!roomId) { alert('Room ID를 입력하세요'); return; }

        const destination = `/app/rooms/${roomId}/leave`;
        stompClient.publish({ destination: destination }); // ⭐️ v7 방식
        log(`➡️ [SEND] ${destination}`);
    }

    function pingRoom() {
        const roomId = document.getElementById('roomId').value;
        if (!roomId) { alert('Room ID를 입력하세요'); return; }

        const destination = `/app/rooms/${roomId}/ping`;
        stompClient.publish({ destination: destination }); // ⭐️ v7 방식
        log(`➡️ [SEND] ${destination} (TTL 갱신)`);
    }

    function sendMessage() {
        const roomId = document.getElementById('messageRoomId').value;
        const content = document.getElementById('messageContent').value;

        const destination = `/app/chats/${roomId}/send`;
        const body = { content: content };

        stompClient.publish({
            destination: destination,
            body: JSON.stringify(body)
        });
        log(`➡️ [SEND] ${destination}\n` + JSON.stringify(body));
    }

    // --- (setConnected 함수는 동일) ---
    function setConnected(connected) {
        connectBtn.disabled = connected;
        disconnectBtn.disabled = !connected;
        enterBtn.disabled = !connected;
        leaveBtn.disabled = !connected;
        pingBtn.disabled = !connected;
        sendBtn.disabled = !connected;
    }
</script>
</body>
</html>
