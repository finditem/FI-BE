name: PR Review Reminder

on:
  workflow_dispatch:
  pull_request:
    types: [opened]
  pull_request_review:
    types: [submitted]
  schedule:
    # 매일 오전 9시 (KST) = UTC 00:00
    - cron: '0 0 * * *'

permissions:
  pull-requests: write
  issues: write

jobs:
  # PR 생성 시 D-라벨이 없으면 D-5 자동 부착
  assign-initial-label:
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: D-라벨 없으면 D-5 부착
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const dLabels = ['D-0', 'D-1', 'D-3', 'D-5'];
            const hasDLabel = labels.some(l => dLabels.includes(l));

            if (!hasDLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: ['D-5']
              });
              console.log(`PR #${context.payload.pull_request.number}에 D-5 라벨 부착`);
            }

  # 리뷰 승인 시 D-라벨 자동 제거
  remove-label-on-approve:
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: D-라벨 제거
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const dLabels = ['D-0', 'D-1', 'D-3', 'D-5'];
            for (const label of labels) {
              if (dLabels.includes(label.name)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: label.name
                });
                console.log(`PR #${prNumber}에서 ${label.name} 라벨 제거`);
              }
            }

  # 매일 오전 9시: 열린 PR 경과일 체크 → 라벨 자동 변경 + 리마인드 코멘트
  check-review-deadline:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: PR 리뷰 기한 체크 및 라벨 업데이트
        uses: actions/github-script@v7
        with:
          script: |
            const dLabels = ['D-0', 'D-1', 'D-3', 'D-5'];

            // 열린 PR 목록 조회
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'created',
              direction: 'asc',
              per_page: 100
            });

            for (const pr of prs) {
              // draft PR 제외
              if (pr.draft) continue;

              // 이미 승인된 리뷰가 있으면 스킵
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number
              });
              const hasApproval = reviews.some(r => r.state === 'APPROVED');
              if (hasApproval) continue;

              // 경과일 계산
              const createdAt = new Date(pr.created_at);
              const now = new Date();
              const diffMs = now - createdAt;
              const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

              // 경과일에 따른 목표 라벨 결정
              let targetLabel;
              if (diffDays >= 5) {
                targetLabel = 'D-0';
              } else if (diffDays >= 3) {
                targetLabel = 'D-1';
              } else if (diffDays >= 2) {
                targetLabel = 'D-3';
              } else {
                targetLabel = 'D-5';
              }

              // 현재 D-라벨 확인
              const currentLabels = pr.labels.map(l => l.name);
              const currentDLabel = currentLabels.find(l => dLabels.includes(l));

              // 라벨 변경이 필요한 경우
              if (currentDLabel !== targetLabel) {
                // 기존 D-라벨 제거
                if (currentDLabel) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: pr.number,
                      name: currentDLabel
                    });
                  } catch (e) {
                    console.log(`라벨 제거 실패: ${e.message}`);
                  }
                }

                // 새 D-라벨 부착
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: [targetLabel]
                });

                console.log(`PR #${pr.number}: ${currentDLabel || '없음'} → ${targetLabel} (${diffDays}일 경과)`);
              }
            }
