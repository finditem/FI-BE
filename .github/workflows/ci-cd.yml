name: Build & Deploy to EC2

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:  # 수동 실행도 가능

permissions:
  contents: read

concurrency:
  group: deploy-ec2-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: 빌드하기
        run: ./gradlew clean build -x test

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v4

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: application.yml 생성
        run: |
          cat <<'EOF' > src/main/resources/application.yml
          ${{ secrets.APPLICATION_YML }}
          EOF

      - name: application-dev.yml 생성
        run: |
          cat <<'EOF' > src/main/resources/application-dev.yml
          ${{ secrets.APPLICATION_DEV }}
          EOF

      - name: application-prod.yml 생성
        run: |
          cat <<'EOF' > src/main/resources/application-prod.yml
          ${{ secrets.APPLICATION_PROD }}
          EOF

      - name: AWS 인증 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ap-northeast-2

      - name: ECR에 로그인
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker 이미지 빌드 및 ECR 푸시
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: fmi-backend # ECR 레포지토리 이름
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -e
            cd ~/FMI-BE

            # AWS ECR 로그인 
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com

            # 환경 변수 파일 생성/업데이트
            echo "Setting up environment variables..."
            {
              echo "ECR_IMAGE_URL=${{ secrets.ECR_IMAGE_URL }}"
              echo "PROD_DB_URL=${{ secrets.PROD_DB_URL }}"
              echo "DEV_DB_URL=${{ secrets.DEV_DB_URL }}"
              echo "PROD_DB_USERNAME=${{ secrets.PROD_DB_USERNAME }}"
              echo "DEV_DB_USERNAME=${{ secrets.DEV_DB_USERNAME }}"
              echo "PROD_DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}"
              echo "DEV_DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}"
              echo "DDL_AUTO=validate"
              echo "REDIS_HOST=${{ secrets.REDIS_HOST }}"
              echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}"
              echo "PROD_JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}"
              echo "DEV_JWT_SECRET=${{ secrets.DEV_JWT_SECRET }}"
              echo "AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}"
              echo "AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}"
              echo "MAIL_HOST=${{ secrets.MAIL_HOST }}"
              echo "MAIL_PORT=${{ secrets.MAIL_PORT }}"
              echo "MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}"
              echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}"
              echo "KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}"
              echo "KAKAO_REST_API_KEY_DEV=${{ secrets.KAKAO_REST_API_KEY_DEV }}"
              echo "KAKAO_REDIRECT_URI=${{ secrets.KAKAO_REDIRECT_URI }}"
              echo "KAKAO_REDIRECT_URI_DEV=${{ secrets.KAKAO_REDIRECT_URI_DEV }}"
              echo "KAKAO_ADMIN_KEY=${{ secrets.KAKAO_ADMIN_KEY }}"
              echo "SLACK_WEBHOOK_INQUIRY_URL=${{ secrets.SLACK_WEBHOOK_INQUIRY_URL }}"
              echo "SLACK_WEBHOOK_REPORT_URL=${{ secrets.SLACK_WEBHOOK_REPORT_URL }}"
              echo "JWT_COOKIE_DOMAIN=${{ secrets.JWT_COOKIE_DOMAIN }}"
              echo "SPRING_FLYWAY_BASELINE_ON_MIGRATE=true"
              echo "SPRING_FLYWAY_BASELINE_VERSION=1"
            } > .env

            # 환경 변수 파일 권한 설정
            chmod 600 .env

            # ECR에서 최신 이미지 가져오기
            docker compose pull fmi-dev fmi-prod

            # 컨테이너 실행 (변경사항 적용)
            docker compose up -d --no-deps fmi-dev fmi-prod

            # 안 쓰는 옛날 이미지 삭제 
            docker image prune -f
