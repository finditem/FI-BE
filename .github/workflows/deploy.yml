name: Deploy

on:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: ${{ github.ref_name == 'develop' }}
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      TARGET: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      RUNTIME_CONFIG: ${{ vars.RUNTIME_CONFIG }}
      RUNTIME_SECRET: ${{ secrets.RUNTIME_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: AWS 인증 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ap-northeast-2

      - name: ECR 로그인
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker image 빌드 및 ECR push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ env.TARGET }}
        run: |
          docker build -t "$ECR_REGISTRY/fmi-backend:${{ github.sha }}" -t "$ECR_REGISTRY/fmi-backend:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/fmi-backend:${{ github.sha }}"
          docker push "$ECR_REGISTRY/fmi-backend:$IMAGE_TAG"

      - name: runtime env 파일 생성
        env:
          ECR_IMAGE_URL: ${{ steps.login-ecr.outputs.registry }}/fmi-backend
        run: |
          umask 077
          {
            printf 'ECR_IMAGE_URL=%s\n' "$ECR_IMAGE_URL"
            printf '%s\n' "$RUNTIME_CONFIG"
            printf '%s\n' "$RUNTIME_SECRET"
          } > ".env.$TARGET"

      - name: EC2에 배포 파일 전송
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml,.env.${{ env.TARGET }}
          target: ~/FMI-BE

      - name: EC2 배포
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 25m
          envs: TARGET,ECR_REGISTRY
          script: |
            set -e
            cd ~/FMI-BE
            chmod 600 ".env.$TARGET"
            docker compose --env-file ".env.$TARGET" config --quiet
            aws ecr get-login-password --region ap-northeast-2 \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker compose --env-file ".env.$TARGET" pull "fmi-$TARGET"
            docker compose --env-file ".env.$TARGET" up -d --no-deps "fmi-$TARGET"
            docker image prune -f
